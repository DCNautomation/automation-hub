name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hub:hub@localhost:5432/hub
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt pytest-cov
      - name: Run tests with coverage
        run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=95

  web:
    name: Dashboard (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  migrations-and-boot:
    name: Stack boots from scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Dashboard container serves the app with a Content-Security-Policy
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q "<div id=\"root\">"
          curl -fsSI http://127.0.0.1:8080/ | grep -i "^content-security-policy: default-src 'self'"
      - name: Worker reports in and the migration for it applied
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/healthz/worker; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: API connects as the limited role
        run: docker compose exec -T postgres psql -U hub -d hub -Atc "select usename from pg_stat_activity where datname='hub' and usename='hub_app' limit 1" | grep -q hub_app
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
